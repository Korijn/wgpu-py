# ===== Project info

[project]
dynamic = ["version"]
name = "wgpu"
description = "WebGPU for Python"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Almar Klein" }, { name = "Korijn van Golen" }]
keywords = ["webgpu", "wgpu", "vulkan", "metal", "DX12", "opengl"]
requires-python = ">= 3.11"
dependencies = [
    "cffi>=1.15.0",
    "sniffio>=1.3",                                  # detect asyncio vs trio when awaiting; see wgpu/_runtime/awaitable.py
    "rubicon-objc>=0.4.1; sys_platform == 'darwin'",
    "rendercanvas >=2.7",                            # Temporarily depend on rendercanvas because we re-aligned apis. Remove in a few months
]

[project.optional-dependencies]
# For users
imgui = ["imgui-bundle>=1.92.0, <2"]
# For devs / ci
build = ["build", "cffi>=1.15.0", "cibuildwheel", "hatchling", "twine"]
codegen = ["pytest", "numpy", "ruff"]
lint = ["ruff", "pre-commit"]
tests = [
    "numpy",
    "pytest",
    "psutil",
    "imageio",
    "anyio",
    "trio",
    "rendercanvas>=2.4.0",
]
examples = ["pypng", "rendercanvas", "glfw", "imgui_bundle"]
docs = ["sphinx>7.2", "sphinx_rtd_theme"]
dev = ["wgpu[build,codegen,lint,tests,examples,docs]"]

[project.entry-points."pyinstaller40"]
hook-dirs = "wgpu.__pyinstaller:get_hook_dirs"
tests = "wgpu.__pyinstaller:get_test_dirs"

[project.urls]
Homepage = "https://github.com/pygfx/wgpu-py"
Documentation = "https://wgpu-py.readthedocs.io"
Repository = "https://github.com/pygfx/wgpu-py"

# ===== Building
#
# There are a variety of build backends, e.g.:
# * setuptools: need this if you have a setup.py
# * flit: really nice for pure Python libs.
# * hatchling: modern, with pretty good defaults, and configurable. Just right for us!
# * mesonpy: numpy, scikit-image, et al. use this because they compile stuff.

[build-system]
requires = ["hatchling", "cffi>=1.15.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "wgpu/_version.py"

# The sdist carries everything a build needs, including the wgpu-native Rust
# sources -- building it is the whole point, and there is no prebuilt library
# to fall back on any more. Cargo still fetches the crate dependencies, so a
# source build needs a Rust toolchain and network access; binary wheels are
# published for every supported platform so that most people never do one.
[tool.hatch.build.targets.sdist]
include = ["wgpu", "bindgen", "tools", "wgpu-native"]
exclude = [
    "*.so", "*.dll", "*.dylib", "*.pyd", "*.o", "*.obj",
    "wgpu-native/target",   # Rust build output: ~1 GB of it
    "wgpu-native/examples",
]

[tool.hatch.build.targets.wheel]
packages = ["wgpu"]
artifacts = ["*.so", "*.dll", "*.dylib", "*.pyd"]
# The compiled extension is the deliverable; its C sources and objects are
# build residue and would otherwise be swept up by the artifacts globs.
exclude = ["wgpu/_native/*.c", "wgpu/_native/*.o", "wgpu/_native/*.obj"]

# A hatch build hook compiles the cffi extension (statically linking the
# wgpu-native submodule) right before the wheel is built. See tools/.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/hatch_build.py"

# ===== Binary wheels
#
# Each wheel embeds a CPython extension that statically links wgpu-native, so
# there is one per (platform, architecture, interpreter). cibuildwheel runs the
# matrix; see .github/workflows/cd.yml.

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
# musllinux would need a musl Rust target and toolchain in the container, and
# nobody has asked for it. manylinux covers the glibc distros.
skip = "*-musllinux_*"
build-frontend = "build"
# Rust is the actual dependency here; the submodule is compiled, not fetched.
# Building it once per interpreter would trip the matrix over the CI time
# limit, so the archive is built in before-all and reused (the build hook skips
# cargo when it is already present).
before-all = "cargo build --release --lib --manifest-path wgpu-native/Cargo.toml"
test-command = "python -c \"import wgpu; import wgpu.backends.wgpu_native as n; print(wgpu.__version__, n.__version__)\""

[tool.cibuildwheel.linux]
# Pinned rather than left to the default, so a cibuildwheel upgrade cannot
# quietly raise the glibc floor. manylinux2014 is glibc 2.17, which is also
# the minimum for Rust's x86_64/aarch64 linux-gnu targets -- so this is the
# oldest baseline the toolchain can actually produce.
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
# The manylinux image has no Rust, and rustup's default install is not on PATH
# for later steps, so it is placed somewhere the container already looks.
before-all = """
curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
source $HOME/.cargo/env
cargo build --release --lib --manifest-path wgpu-native/Cargo.toml
"""
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# wgpu-native's Metal backend needs a deployment target new enough for the
# frameworks rustc reports; 11.0 is the floor for arm64 anyway.
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

# ===== Tooling

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "N", "B", "RUF"]
ignore = [
    "E501",   # Line too long
    "E731",   # Do not assign a `lambda` expression, use a `def`
    "B007",   # Loop control variable `x` not used within loop body
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
]

[tool.ruff.lint.per-file-ignores]
# Generated from webgpu.json; member names deliberately mirror the upstream
# spec spelling (e.g. RGBA8_unorm, surface_source_XCB_window), so the usual
# naming conventions do not apply.
"wgpu/_generated/*" = ["N801", "N802", "N803", "N815", "N816"]

[tool.coverage.report]
exclude_also = [
    # Have to re-enable the standard pragma, plus a less-ugly flavor
    "pragma: no cover",
    "no-cover",
    "raise NotImplementedError",
]
