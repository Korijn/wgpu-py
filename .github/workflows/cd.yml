# Github Actions script to produce binary wheels.
#
# Every wheel contains a CPython extension that statically links wgpu-native,
# so there is nothing to download at install time -- but it does mean a wheel
# per platform *and* per interpreter, built on a runner of that architecture.
# cibuildwheel drives that matrix; the Rust build happens inside it.

name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  # Unfiltered, as in ci.yml: a wheel matrix that only runs for pull requests
  # into one branch is a wheel matrix that does not run. It is the expensive
  # workflow, so if the fork's minutes become a concern, narrow it with a path
  # filter or a label rather than a branch name.
  pull_request:

jobs:

  build-wheels:
    name: Wheels for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            os: ubuntu-latest
            archs: x86_64
          - name: linux aarch64
            os: ubuntu-24.04-arm
            archs: aarch64
          - name: macos arm64
            os: macos-latest
            archs: arm64
          - name: macos x86_64
            os: macos-15-intel  # the last Intel-based image
            archs: x86_64
          - name: windows amd64
            os: windows-latest
            archs: AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          # The binding is compiled from the pinned submodule, so the build
          # cannot start without it.
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - name: Check the wheel tags
        shell: bash
        run: |
            # An unrepaired Linux wheel is tagged `linux_x86_64`, which PyPI
            # rejects outright -- and it would only be noticed at upload, after
            # the tag is cut. Assert the platform tag here instead.
            ls -la wheelhouse/
            python - <<'PY'
            import pathlib, sys
            wheels = sorted(pathlib.Path("wheelhouse").glob("*.whl"))
            assert wheels, "cibuildwheel produced no wheels"
            expected = "${{ matrix.name }}".split()[0]
            bad = []
            for wheel in wheels:
                tag = wheel.stem.split("-")[-1]
                if expected == "linux" and not tag.startswith("manylinux"):
                    bad.append(f"{wheel.name}: {tag} is not a manylinux tag")
                if expected == "macos" and not tag.startswith("macosx"):
                    bad.append(f"{wheel.name}: {tag} is not a macosx tag")
            print("\n".join(w.name for w in wheels))
            if bad:
                sys.exit("\n".join(bad))
            # Three interpreters per platform, and no more.
            assert len(wheels) == 3, f"expected cp311/312/313, got {len(wheels)}"
            PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.archs }}-${{ runner.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Without this the submodule is an empty directory, and the sdist
          # ships with no Rust sources at all -- so it builds nothing and the
          # failure only shows up for whoever installs from source.
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
            python -m pip install --upgrade pip build twine
            python -m build --sdist
            twine check dist/*
      - name: Check the sdist can actually build
        run: |
            # The wheels are binary, so nothing else here would notice an sdist
            # that is missing the sources it exists to carry.
            python - <<'PY'
            import pathlib, sys, tarfile
            sdist = next(iter(pathlib.Path("dist").glob("*.tar.gz")))
            names = tarfile.open(sdist).getnames()
            required = [
                "wgpu-native/Cargo.toml",
                "wgpu-native/src/lib.rs",
                "wgpu-native/ffi/wgpu.h",
                "wgpu-native/ffi/webgpu-headers/webgpu.h",
                "wgpu-native/ffi/webgpu-headers/webgpu.json",
            ]
            missing = [
                r for r in required
                if not any(n.endswith("/" + r) for n in names)
            ]
            if missing:
                sys.exit(f"{sdist.name} is missing:\n  " + "\n  ".join(missing))
            print(f"{sdist.name}: {len(names)} entries, sources present")
            PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test-wheels:
    name: Test wheel on ${{ matrix.name }}
    needs: [build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every architecture a wheel is built for is installed and run here.
        # An untested wheel is the whole risk of shipping a compiled binding:
        # it is not the build that fails, it is the import on someone's machine.
        include:
          - name: windows amd64
            os: windows-latest
          - name: macos arm64
            os: macos-latest
          - name: macos x86_64
            os: macos-15-intel
          - name: linux x86_64
            os: ubuntu-latest
          - name: linux aarch64
            os: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: wheels-*
        merge-multiple: true
    - name: Install a software GPU driver
      if: runner.os == 'Linux'
      run: |
          sudo apt update
          sudo apt install -y mesa-vulkan-drivers
    - name: Install the wheel and use it
      shell: bash
      run: |
          # Install from the built wheels only -- never fall back to an index,
          # or a passing test might be testing a released wgpu instead.
          pip install --no-index --find-links dist wgpu
          pip install numpy pytest
          # Leave the repo, so `import wgpu` cannot resolve to the source tree.
          pushd $HOME
          python - <<'PY'
          import os, sys, wgpu, wgpu.backends.wgpu_native as native

          print("wgpu", wgpu.__version__, "/ wgpu-native", native.__version__)
          # The whole point of these wheels: the extension is compiled in, not
          # downloaded. A pure-Python fallback would still import cleanly.
          import wgpu._native
          assert wgpu._native.lib is not None
          print("extension:", wgpu._native.__file__)

          adapter = wgpu.gpu.request_adapter_sync()
          if adapter is None:
              # Linux installs lavapipe above, so there we know one must exist.
              # Elsewhere the runner's driver situation is not ours to promise,
              # and a missing adapter is not a broken wheel.
              if sys.platform.startswith("linux"):
                  sys.exit("no adapter, but a software driver was installed")
              print("no adapter on this runner; import and link verified")
              raise SystemExit(0)

          print("adapter:", adapter.summary)
          device = adapter.request_device_sync()
          buf = device.create_buffer(size=256, usage="COPY_SRC|COPY_DST")
          assert buf.size == 256
          # Exercise the compiled path end to end rather than just allocating.
          device.queue.write_buffer(buf, 0, b"\xab" * 256)
          assert bytes(device.queue.read_buffer(buf))[:4] == b"\xab" * 4
          print("ok")
          PY
          popd

  publish:
    name: Publish to Github and Pypi
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist, test-wheels]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/wgpu
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download assets
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Set version from git ref
      run: echo "WGPU_PY_VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.WGPU_PY_VERSION }}
        name: ${{ env.WGPU_PY_VERSION }}
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
            dist/*.tar.gz
            dist/*.whl
        body: |
            Binary wheels with wgpu-native compiled in.
            See [the changelog](https://github.com/pygfx/wgpu-py/blob/main/CHANGELOG.md) for details.
        draft: false
        prerelease: false
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
