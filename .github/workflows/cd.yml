# Github Actions script to produce binary wheels.
#
# Every wheel contains a CPython extension that statically links wgpu-native,
# so there is nothing to download at install time -- but it does mean a wheel
# per platform *and* per interpreter, built on a runner of that architecture.
# cibuildwheel drives that matrix; the Rust build happens inside it.

name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:

  build-wheels:
    name: Wheels for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            os: ubuntu-latest
            archs: x86_64
          - name: linux aarch64
            os: ubuntu-24.04-arm
            archs: aarch64
          - name: macos arm64
            os: macos-latest
            archs: arm64
          - name: macos x86_64
            os: macos-15-intel  # the last Intel-based image
            archs: x86_64
          - name: windows amd64
            os: windows-latest
            archs: AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          # The binding is compiled from the pinned submodule, so the build
          # cannot start without it.
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: ${{ matrix.archs }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.archs }}-${{ runner.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
            python -m pip install --upgrade pip build twine
            python -m build --sdist
            twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test-wheels:
    name: Test wheel on ${{ matrix.name }}
    needs: [build-wheels]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows amd64
            os: windows-latest
          - name: macos arm64
            os: macos-latest
          - name: linux x86_64
            os: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download wheels
      uses: actions/download-artifact@v4
      with:
        path: dist
        pattern: wheels-*
        merge-multiple: true
    - name: Install a software GPU driver
      if: runner.os == 'Linux'
      run: |
          sudo apt update
          sudo apt install -y mesa-vulkan-drivers
    - name: Install the wheel and use it
      shell: bash
      run: |
          # Install from the built wheels only -- never fall back to an index,
          # or a passing test might be testing a released wgpu instead.
          pip install --no-index --find-links dist wgpu
          pip install numpy pytest
          # Leave the repo, so `import wgpu` cannot resolve to the source tree.
          pushd $HOME
          python -c "
          import wgpu
          print('wgpu', wgpu.__version__)
          import wgpu.backends.wgpu_native as native
          print('wgpu-native', native.__version__)
          adapter = wgpu.gpu.request_adapter_sync()
          print('adapter', adapter.info['adapter_type'], adapter.info['backend_type'])
          device = adapter.request_device_sync()
          buf = device.create_buffer(size=256, usage='COPY_SRC|COPY_DST')
          assert buf.size == 256
          print('ok')
          "
          popd

  publish:
    name: Publish to Github and Pypi
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist, test-wheels]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/wgpu
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download assets
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true
    - name: Set version from git ref
      run: echo "WGPU_PY_VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
    - name: Upload Release Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.WGPU_PY_VERSION }}
        name: ${{ env.WGPU_PY_VERSION }}
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
            dist/*.tar.gz
            dist/*.whl
        body: |
            Binary wheels with wgpu-native compiled in.
            See [the changelog](https://github.com/pygfx/wgpu-py/blob/main/CHANGELOG.md) for details.
        draft: false
        prerelease: false
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
